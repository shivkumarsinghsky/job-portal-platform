# Prototype API (in-memory, seeded with sample jobs) and a PostgreSQL instance for the SQL model.
#   docker compose up -d --build        → http://localhost:8000/docs
# Credentials are local development values only.
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports: ["${API_PORT:-8000}:8000"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs-local-dev
      POSTGRES_DB: jobs
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
